# Lars-Win-AI — Alacritty-Konfiguration (WS-A)
# Vertrag: docs/CONTRACTS.md §7. Alacritty >= 0.13 (TOML). Getestet mit 0.17.
#
# Start (durch Daemon/Installer, NICHT hier erzwingen):
#   alacritty.exe -T "AI-Assistant" --config-file <repo>\config\alacritty\alacritty.toml -e herdr
# Bewusst KEIN [terminal].shell, damit die Konfiguration auch für manuelle
# PowerShell-Sitzungen ohne Herdr verwendbar bleibt.

[window]
# Nackte, borderlose Titelleiste (Windows-native Titelleiste ausgeblendet).
decorations = "None"
# Leichte Transparenz. Zentraler Testwert laut PLAN.md §6B.
# Hinweis: Transparenz benötigt GPU-Unterstützung (supports_transparency).
# Meldet der Renderer supports_transparency=false (bekannter Fall unter
# Windows 11 / bestimmten Treibern), bleibt das Fenster voll deckend —
# Fallback laut PLAN.md §9: nur das opencode-Theme bleibt transparent.
opacity = 0.90
# Fenstertitel dynamisch halten; der statische Titel "AI-Assistant" ist der
# stabil Wert, über den der Daemon das Fenster findet.
dynamic_title = true
title = "AI-Assistant"
startup_mode = "Windowed"
# Innenabstand, dynamisch verteilt.
padding = { x = 8, y = 8 }
dynamic_padding = true
# Windows-Fallback: kein Blur hinter dem transparenten Fenster.
blur = false

[font]
size = 11.0

# Nerd-Font über alle Schnitte; die style-Felder werden bewusst weggelassen,
# damit die Defaults (Regular/Bold/Italic/BoldItalic) greifen und keine
# auskommentierten style-Zeilen nötig sind.
[font.normal]
family = "CaskaydiaCove Nerd Font"

[font.bold]
family = "CaskaydiaCove Nerd Font"

[font.italic]
family = "CaskaydiaCove Nerd Font"

[font.bold_italic]
family = "CaskaydiaCove Nerd Font"

# Transparenz kommt über [window].opacity; der Hintergrund ist reines Schwarz,
# damit sich der Alpha-Kanal sauber über den Desktop legt.
[colors.primary]
background = "#000000"

# Visual Mode / Copy — Standardwert explizit festschreiben (essenziell).
[keyboard]
bindings = [{ key = "Space", mods = "Control|Shift", action = "ToggleViMode" }]
